 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dc6fa4" stop-opacity="0"/><stop offset=".5" stop-color="#fab39a" stop-opacity=".33"/><stop offset="1" stop-color="#dc6fa4" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
 <clipPath id="panel"><rect x="89" y="79" width="822" height="407" rx="6"/></clipPath>
</defs>
