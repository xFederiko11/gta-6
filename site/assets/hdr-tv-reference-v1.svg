<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Televisore OLED illustrato, riferimento visivo</title>
<desc id="desc">Illustrazione vettoriale originale di un televisore OLED con paesaggio colorato. Non è una fotografia del prodotto né una schermata del videogioco.</desc>
<defs>
 <linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#201a39"/><stop offset=".62" stop-color="#35244b"/><stop offset="1" stop-color="#181a35"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#231f5e"/><stop offset=".35" stop-color="#845eac"/><stop offset=".65" stop-color="#e38aac"/><stop offset="1" stop-color="#ffbb9a"/></linearGradient>
