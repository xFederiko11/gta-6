name: Refine mobile visual layout once
on:
  push:
    branches: [feature/visual-guide-redesign-20261120]
    paths: ['.github/workflows/refine-visual-mobile-once.yml']
permissions:
  contents: write
concurrency:
  group: visual-layout-refinement
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/visual-guide-redesign-20261120
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Correct only inspected visual details
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/assets/visual-v2.css'); text=p.read_text()
          before='.v-photo{display:block;width:100%;aspect-ratio:16/9;'
          assert text.count(before)==1
          p.write_text(text.replace(before,'.v-photo{display:block;width:100%;height:auto;aspect-ratio:16/9;'))
          p=Path('visual_guide_content.py'); text=p.read_text()
          replacements={
            "'soldi-facili-capitolo-1': 'leonida'":"'soldi-facili-capitolo-1': 'bank-deposit'",
            "'soldi-2500-three-sheets-liquor': 'traffic'":"'soldi-2500-three-sheets-liquor': 'bank-phone'",
            "'sportive-randy-posizioni': 'traffic'":"'sportive-randy-posizioni': 'register-car'"
          }
          for before,after in replacements.items():
              assert text.count(before)==1,before
              text=text.replace(before,after)
          p.write_text(text)
          p=Path('data/visual_media.json'); data=json.loads(p.read_text())
          data['images']['vice-city']['alt']='Scena urbana con un aereo dal materiale promozionale di GTA VI'
          data['images']['vice-city']['caption']='Materiale promozionale Rockstar Games: immagine di atmosfera, non una mappa del percorso.'
          data['images']['leonida']['alt']='Scena di strada dal materiale promozionale di GTA VI'
          data['images']['leonida']['caption']='Scena promozionale di GTA VI: non identifica la posizione del bottino.'
          data['images']['traffic']['alt']='Personaggi affacciati su una terrazza nel materiale promozionale di GTA VI'
          data['images']['traffic']['caption']='Immagine promozionale Rockstar Games: non documenta un passaggio o uno spawn.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('visual_browser_qa.py'); text=p.read_text()
          before="assert not overflow,(label,name,'horizontal overflow')"
          after=before+"\n                if name in ('garage','money'):\n                    box=page.locator('.v-intro .v-photo').bounding_box()\n                    assert box and box['height'] < box['width'] * 0.75, ('cover aspect ratio',label,name,box)"
          assert text.count(before)==1
          p.write_text(text.replace(before,after))
          PY
      - name: Test repaired pages and capture real screens
        run: |
          python -m pip install playwright 'Pillow>=11,<13'
          python -m playwright install --with-deps chromium
          python -m unittest -q test_site.py test_community_feed.py test_related_research.py test_guide_source_validation.py
          python prepare_visual_media.py
          python build_visual_site.py
          python -m unittest -q test_visual_site.py
          python visual_browser_qa.py
      - name: Commit tested refinements and remove this one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/visual-v2.css visual_guide_content.py data/visual_media.json visual_browser_qa.py
          git rm .github/workflows/refine-visual-mobile-once.yml
          git commit -m 'Fix mobile cover ratios and use context-relevant guide thumbnails'
          git push origin HEAD:feature/visual-guide-redesign-20261120
      - name: Package verified screenshots
        if: always()
        run: |
          mkdir -p qa-bundle
          git archive HEAD | gzip > qa-bundle/source.tar.gz
          if [ -d _site ]; then cp -R _site qa-bundle/site; fi
          if [ -d visual-qa ]; then cp -R visual-qa qa-bundle/screens; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: visual-refined-preview
          path: qa-bundle
          retention-days: 3
