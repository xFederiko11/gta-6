name: GTA 6 Italia - Website

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'data/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - 'growth_tracking_v1.py'
      - 'test_growth_tracking_v1.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 21 11 *'
    - cron: '45 */4 * * *'

permissions:
  contents: read
concurrency:
  group: gta6-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  # During launch, a fresh main-branch commit supersedes stale builds.
  # The latest deployment receives its own post-deploy HTTP checks.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python pinned
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Fetch research from public GTA VI bot (no Buffer)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python fetch_community_feed.py
      - name: Collect owned X post excerpts without requiring GitHub login
        run: python community_social_sync_v1.py
      - name: Validate preserved content and existing SEO contracts
        run: |
          python -m py_compile x_growth_dashboard_v1.py test_x_growth_dashboard_v1.py interactive_article_maps_v1.py test_interactive_article_maps_v1.py test_curated_map_permalinks_v1.py photo_coverage_v5.py test_photo_coverage_v5.py social_cards_v2.py test_social_cards_v2.py collectible_routes_v4.py collectible_photo_evidence_v1.py test_collectible_photo_evidence_v1.py photo_intake_v4.py test_photo_routes_v4.py advanced_platinum_v3.py photo_provenance_v3.py test_advanced_platinum_v3.py platinum_atlas_v2.py guide_location_atlas_v2.py test_group12_atlas_v2.py platinum_roadmap_v1.py guide_step_references_v1.py test_group3_roadmap_step_refs_v1.py photo_request_hub_v1.py test_photo_request_hub_v1.py build_site.py build_visual_site.py visual_guide_content.py operational_brief_v1.py moses_vehicle_jobs_v1.py test_operational_guides_v1.py community_social_v1.py community_social_sync_v1.py community_discovery_v2.py guide_source_validation.py prepare_visual_media.py reader_experience.py media_quality_v1.py growth_tracking_v1.py meditation_tracker_v1.py test_meditation_tracker_v1.py
          python -m unittest -q test_x_growth_dashboard_v1.py test_curated_map_permalinks_v1.py test_interactive_article_maps_v1.py test_photo_coverage_v5.py test_photo_routes_v4.py test_advanced_platinum_v3.py test_group12_atlas_v2.py test_group3_roadmap_step_refs_v1.py test_meditation_tracker_v1.py test_site.py test_community_feed.py test_related_research.py test_guide_source_validation.py
          node --check site/assets/interactive-map-v1.js
          node --check site/assets/photo-coverage-v5.js
          node --check site/assets/photo-intake-v4.js
          node --check site/assets/collectible-routes-v4.js
          node --check site/assets/advanced-platinum-v3.js
          node --check site/assets/platinum-atlas-v2.js
          node --check site/assets/platinum-roadmap.js
          node --check site/assets/visual-v2.js
          node --check site/assets/reader-theme.js
          node --check site/assets/guide-flow-v1.js
          node --check site/assets/collectible-beginner-v1.js
          node --check site/assets/community-social-v1.js
          python -m py_compile community_social_sync_v1.py test_x_permalink_site_v1.py test_beginner_platinum_v1.py
          python -m unittest -q test_community_social_v1.py test_x_permalink_site_v1.py test_growth_tracking_v1.py
      - name: Optimize curated screenshots for mobile
        run: |
          python -m pip install 'Pillow>=11,<13'
          python prepare_visual_media.py
      - name: Prepare public X growth evidence from fixed GitHub issues (read only)
        env:
          PUBLIC_GROWTH_FETCH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$PUBLIC_GROWTH_FETCH" = "true" ]; then
            python x_growth_dashboard_v1.py --refresh --output .runtime/x-growth-evidence-v1.json
          else
            python x_growth_dashboard_v1.py --output .runtime/x-growth-evidence-v1.json
          fi
      - name: Build visual production pages with responsive reader and sourced tips
        env:
          GSC_SITE_VERIFICATION: ${{ vars.GSC_SITE_VERIFICATION }}
          # Public Umami UUID from the owner; NEVER track PR browser QA.
          # Evaluated before the generator and privacy page run.
          UMAMI_WEBSITE_ID: ${{ github.event_name != 'pull_request' && 'ec3592c0-e9f7-4e13-8c29-f9c7d59aa8fd' || '' }}
        run: python reader_experience.py --build
      - name: Generate distinct 1200x630 cards for all canonical article URLs
        env:
          GTA6_FETCH_ROCKSTAR_ART: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          python social_cards_v2.py
          python -m unittest -q test_social_cards_v2.py
      - name: Audit actual local media and five-image guide target
        run: python media_quality_v1.py
      - name: Validate actual production pages, media and canonical continuity
        run: python -m unittest -q test_x_growth_dashboard_v1.py test_curated_map_permalinks_v1.py test_interactive_article_maps_v1.py test_photo_coverage_v5.py test_photo_routes_v4.py test_advanced_platinum_v3.py test_group12_atlas_v2.py test_group3_roadmap_step_refs_v1.py test_visual_site.py test_reader_experience.py test_beginner_platinum_v1.py test_operational_guides_v1.py test_collectible_photo_evidence_v1.py test_media_quality_v1.py test_community_social_v1.py test_x_permalink_site_v1.py test_growth_tracking_v1.py test_meditation_tracker_v1.py test_photo_request_hub_v1.py
      - name: Audit static Google discovery links (no network or tracking)
        run: |
          python -m unittest -q test_internal_link_graph_v1.py
          python internal_link_graph_v1.py
          echo '### GTA VI Italia – Internal links (static SEO graph)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage based on generated HTML and sitemap, NOT Google index status.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .runtime/seo-link-graph-v1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Check responsive theme, visible spoiler notices and zoom in a real browser
        # Full visual suite runs on PRs. Production uses its passing PR artifact,
        # fast static regressions and a fresh HTTP verification after deployment.
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python test_reader_experience.py --browser
      - name: Keep reader screenshots and test report
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reader-qa-${{ github.run_id }}
          path: reader-qa
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve Google Search Console verification document
        run: |
          python - <<'PY'
          from pathlib import Path
          name = 'google232edbd3526a5a1d.html'
          expected = b'google-site-verification: google232edbd3526a5a1d.html'
          source = Path('site') / name
          assert source.read_bytes() == expected, 'Unexpected Google verification file contents'
          destination = Path('_site') / name
          destination.write_bytes(source.read_bytes())
          assert destination.read_bytes() == expected
          print('GSC_VERIFICATION_FILE_INCLUDED',destination)
          PY
      - name: Publish only reader content (editorial artifacts remain in CI)
        run: |
          python -m py_compile public_release_gate.py test_public_release_gate.py
          python -m unittest -q test_public_release_gate.py
          python public_release_gate.py --apply
          python public_release_gate.py
      - name: Upload static site to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" != "200" ] || ! grep -Eq '"build_type"[[:space:]]*:[[:space:]]*"workflow"' /tmp/pages.json; then
            echo '::error::Pages must use GitHub Actions before deployment.'
            exit 1
          fi
      - name: Deploy verified visual site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify public pages serve responsive reader, X header and spoiler warnings
        run: |
          python - <<'PY'
          import urllib.request, time, json
          base='https://xfederiko11.github.io/gta-6/'
          for path in ('','soldi-facili/','auto-speciali/','salvare-auto/','guide-e-tutorial/soldi-facili-capitolo-1/','guide-e-tutorial/viaggio-rapido-taxi/','trofei/trofeo-15-stunt-da-capogiro/','trofei/roadmap-platino/','mappe-guide/','trofei/100-percento/','trofei/trofei-difficili/','collezionabili/percorsi/','screenshot-ps5/invia/'):
              for attempt in range(6):
                  try:
                      request=urllib.request.Request(base+path+'?reader=adaptive-v2-20261120',headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          text=response.read(1500000).decode('utf-8'); status=response.status
                      assert status==200
                      assert 'data-design-version="visual-v2-20261120"' in text
                      assert 'assets/social-cards/' in text
                      assert text.count('<meta property="og:image" content="')==1
                      assert text.count('<meta name="twitter:image" content="')==1
                      assert 'visual-v2.css?v=' in text and 'visual-v2.js?v=' in text
                      assert '<link rel="canonical" href="'+base+path+'"' in text
                      assert 'data-theme="auto"' in text
                      assert 'reader-moses-authentic-visual-v8-20261123' in text
                      assert 'reader-theme.css?v=' in text and 'data-theme-choice="light"' in text and 'data-theme-choice="dark"' in text
                      assert "var t='dark'" in text
                      assert 'class="v-x-link"' in text and 'https://x.com/xFederiko11' in text
                      assert 'data-spoiler-choice' not in text
                      if path == 'trofei/roadmap-platino/':
                          assert 'data-platinum-roadmap' in text
                          assert 'data-trophy-atlas' in text
                          assert text.count('data-atlas-card ') == 55
                          assert text.count('data-atlas-spoiler') == 28
                          assert '/gta-6/assets/platinum-roadmap.js?v=' in text
                          assert '/gta-6/assets/platinum-roadmap.css?v=' in text
                          assert '/gta-6/assets/platinum-atlas-v2.js?v=' in text
                          assert '/gta-6/assets/platinum-atlas-v2.css?v=' in text
                      if path in ('mappe-guide/','collezionabili/percorsi/','guide-e-tutorial/soldi-facili-capitolo-1/','guide-e-tutorial/viaggio-rapido-taxi/','trofei/trofeo-15-stunt-da-capogiro/'):
                          assert text.count('data-vi-map ')==1
                          assert 'interactive-map-v1.css?v=' in text and 'interactive-map-v1.js?v=' in text
                          assert 'data-vim-load' in text and 'data-vim-provider="vice"' in text
                          assert '<iframe src=' not in text
                      if path == 'mappe-guide/':
                          assert text.count('data-vim-curated-link') == 7
                          assert 'https://gtamap.io/?m=permit-keys' in text
                          assert text.count('data-location-guide=') == 11
                          assert '/gta-6/screenshot-ps5/' in text
                      if path == 'trofei/100-percento/':
                          assert 'data-advanced-platinum-100' in text
                          assert text.count('data-ap-metric="') == 35
                          assert text.count('data-ap-card="') == 18
                          assert 'advanced-platinum-v3.js?v=' in text
                          assert 'advanced-platinum-v3.css?v=' in text
                      if path == 'trofei/trofei-difficili/':
                          assert text.count('data-hard-trophy="') == 7
                          assert 'data-hard-status="incerto"' in text
                          assert 'advanced-platinum-v3.css?v=' in text
                      if path == 'collezionabili/percorsi/':
                          assert text.count('data-cr-curated-link') == 10
                          assert 'https://gtamap.io/?m=jasons-safehouse' in text
                          assert 'https://gtamap.io/gta-6-map/starlet-motel/' in text
                          assert text.count('data-cr-step=') == 123
                          assert text.count('data-cr-region=') == 7
                          assert 'data-cr-done' in text and 'Vicki' in text and 'Victor Maravilla' in text
                          assert 'collectible-routes-v4.js?v=' in text
                      if path == 'screenshot-ps5/invia/':
                          assert text.count('data-photo-guide=') == 55
                          assert 'data-pi-rights' in text
                          assert 'data-pi-submit disabled' in text
                          assert 'photo-intake-v4.js?v=' in text
                          assert 'Non è un upload dal sito' in text
                      if path in ('salvare-auto/','guide-e-tutorial/soldi-facili-capitolo-1/','guide-e-tutorial/viaggio-rapido-taxi/'):
                          assert 'id="consigli"' in text and 'Fonti dei consigli' in text
                      print('PUBLIC_ADAPTIVE_READER_DEPLOY_OK',base+path)
                      break
                  except Exception:
                      if attempt==5: raise
                      time.sleep(10)
          # The roadmap must also ship its own interactive assets and sitemap entry.
          for path, marker in (
              ('assets/platinum-roadmap.js','gta6-italia:platinum-roadmap:v1'),
              ('assets/platinum-roadmap.css','.p-roadmap'),
              ('assets/platinum-atlas-v2.js','gta6-italia:trophies:v1'),
              ('assets/platinum-atlas-v2.css','.p-atlas'),
              ('assets/advanced-platinum-v3.js','gta6-italia:100-completion:v3'),
              ('assets/advanced-platinum-v3.css','.ap-main'),
              ('assets/collectible-routes-v4.js','gta6-italia:collectible-routes:v4'),
              ('assets/collectible-routes-v4.css','.cr-root'),
              ('assets/photo-intake-v4.js','x.com/intent/tweet'),
              ('assets/photo-intake-v4.css','.pi-page'),
              ('assets/reader-theme.js',"const chooseDefault = () => 'dark'"),
              ('assets/reader-theme.css','--r-bg:#10131d'),
              ('assets/interactive-map-v1.js','game-map-load-intent'),
              ('assets/interactive-map-v1.css','.vim-root'),
              ('sitemap.xml','trofei/roadmap-platino/'),
              ('sitemap.xml','mappe-guide/'),
              ('sitemap.xml','trofei/100-percento/'),
              ('sitemap.xml','trofei/trofei-difficili/'),
              ('sitemap.xml','collezionabili/percorsi/'),
              ('sitemap.xml','screenshot-ps5/invia/'),
          ):
              request=urllib.request.Request(base+path+'?group3-live=20261121',headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  body=response.read(1500000).decode('utf-8')
                  assert response.status==200
              assert marker in body, (path, marker)
              print('PUBLIC_GROUP3_ASSET_OK',base+path)
          # Validate 404 responses for operational content, not just hidden menus.
          from urllib.error import HTTPError
          for private in ('crescita-x/','screenshot-ps5/verifica/',
                          'screenshot-ps5/priorita/','growth-evidence-v1.json',
                          'photo-backlog-v5.json','photo-requests.json',
                          'photo-provenance-review.json','photo-intake-audit.json',
                          'map-rollout-v1.json','design-version.json',
                          'media-quality.json','social-cards-audit.json'):
              for attempt in range(6):
                  request=urllib.request.Request(base+private+'?release-gate=20261121-'+str(attempt),
                                                 headers={'Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:
                          status=response.status
                  except HTTPError as error:
                      if error.code == 404:
                          print('PUBLIC_PRIVATE_PATH_404_OK',private)
                          break
                      if error.code in (429,500,502,503,504) and attempt < 5:
                          print('PUBLIC_PRIVATE_PATH_RETRY',private,'HTTP',error.code,'attempt',attempt+1)
                          time.sleep(5*(attempt+1))
                          continue
                      raise
                  if attempt==5:
                      raise AssertionError('Internal artifact is public: '+private+' HTTP '+str(status))
                  time.sleep(5)
          home=urllib.request.urlopen(base+'?public-nav=1',timeout=20).read(1000000).decode('utf-8')
          assert 'crescita-x/' not in home
          assert 'screenshot-ps5/verifica/' not in home
          assert 'screenshot-ps5/priorita/' not in home
          # Verify the public file byte-for-byte. It is a single-purpose
          # Google-owned proof, not part of our reader HTML templates.
          expected = b'google-site-verification: google232edbd3526a5a1d.html'
          for attempt in range(6):
              try:
                  request=urllib.request.Request(base+'google232edbd3526a5a1d.html',headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      raw=response.read(2048)
                      assert response.status==200
                  assert raw==expected
                  print('PUBLIC_GSC_VERIFICATION_FILE_OK',base+'google232edbd3526a5a1d.html')
                  break
              except Exception:
                  if attempt==5: raise
                  time.sleep(10)
          # Google also supports the supplied meta tag on the URL-prefix home.
          for attempt in range(6):
              try:
                  request=urllib.request.Request(base+'?gsc-proof=20261120',headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      homepage=response.read(1500000).decode('utf-8')
                      assert response.status==200
                  assert '<meta name="google-site-verification" content="U1WNfaHHGPHzojaeFvn_GGhVrWb5TYeDyUPgpmCX6Nw">' in homepage
                  print('PUBLIC_GSC_META_TAG_OK',base)
                  break
              except Exception:
                  if attempt==5: raise
                  time.sleep(10)
          # Verify Umami is actually shipped to each published page exactly
          # once, with safe first-party domain and no personal identifiers.
          for path in ('','trofei/','guide-e-tutorial/','hdr-oled/','privacy/'):
              for attempt in range(6):
                  try:
                      request=urllib.request.Request(base+path+'?analytics=gta6-20261120',headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          markup=response.read(1500000).decode('utf-8')
                          assert response.status == 200
                      assert markup.count('id="growth-analytics-v1"') == 1
                      assert 'src="https://cloud.umami.is/script.js"' in markup
                      assert 'data-website-id="ec3592c0-e9f7-4e13-8c29-f9c7d59aa8fd"' in markup
                      assert 'data-domains="xfederiko11.github.io"' in markup
                      assert 'data-do-not-track="true"' in markup
                      if path == 'privacy/':
                          assert 'Umami Cloud è attivo' in markup
                      print('PUBLIC_GTA6_UMAMI_TAG_OK',base+path)
                      break
                  except Exception:
                      if attempt == 5: raise
                      time.sleep(10)
          PY

      - name: Verify beginner-friendly tutorials and real screenshots in production
        run: |
          python - <<'PY'
          import urllib.request, time
          base='https://xfederiko11.github.io/gta-6/'
          def fetch(path):
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(base+path+'?tutorial-qa=reader-first',
                                                 headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          assert response.status==200
                          return response.read(1800000).decode('utf-8')
                  except Exception:
                      if attempt==5: raise
                      time.sleep(10)
          for path in (
              'salvare-auto/',
              'guide-e-tutorial/soldi-facili-capitolo-1/',
              'guide-e-tutorial/viaggio-rapido-taxi/',
              'guide-e-tutorial/glitch-prima-persona-ps5/',
          ):
              page=fetch(path)
              assert 'class="v-intro v-guide-intro"' in page
              assert 'class="v-tutorial-start-here"' in page
              assert 'guide-flow-v1.css?v=' in page
              assert 'guide-flow-v1.js?v=' in page
              assert 'id="procedura"' in page
              assert 'class="v-steps"' in page
              assert 'class="v-guide-prep"' in page
              assert 'class="v-guide-more"' in page
              assert page.index('id="passaggio-1"') < page.index('class="v-guide-more"')
              assert page.index('id="procedura"') < page.index('id="passaggio-1"')
              if path in ('salvare-auto/', 'guide-e-tutorial/glitch-prima-persona-ps5/'):
                  assert '✓ Controllo:' in page
              assert 'class="reader-photo-invite"' in page
              assert 'class="v-step-photo-gap"' not in page
              assert 'data-visual-screenshot-count' not in page
              assert 'data-visual-request-photo' not in page
              assert 'screenshot-ps5/verifica/' not in page
              assert 'screenshot-ps5/priorita/' not in page
              if path=='salvare-auto/':
                  steps=page.split('<ol class="v-steps">',1)[1].split('</ol>',1)[0]
                  assert 'data-visual-kind="screenshot"' in steps
                  assert 'Comandi PS5:' in page
              print('PUBLIC_BEGINNER_TUTORIAL_OK',base+path)
          moses=fetch('guide-e-tutorial/veicoli-per-moses/')
          assert 'operational-guide-v1.css?v=' in moses
          assert moses.count('class="v-step"')==7
          assert moses.count('mo-photo-link')==6
          assert moses.count('data-mo-real-gameplay=')==6
          assert moses.count('class="mo-video-screen"')==6
          assert moses.count('<iframe ')==6
          assert 'https://www.youtube-nocookie.com/embed/UyxxY0A_kow?start=101' in moses
          assert 'data-mo-default-all' in moses
          assert 'data-mo-show-all' in moses
          assert 'moses-visual-v1.css?v=' in moses
          assert 'data-mo-gift-ref="source-only"' in moses
          assert '2727' in moses
          assert '6.310 GTA' in moses
          assert moses.index('Capitolo 2, dopo Daily Driver') < moses.index('id="passaggio-1"')
          assert moses.count('Fonte video: IGN su YouTube')==6
          assert 'Guarda anche le foto sulla guida PowerPyx' in moses
          assert 'Non è disponibile qui un’immagine riutilizzabile' in moses
          assert 'data-mo-chapter-seconds="520"' in moses
          garage=fetch('salvare-auto/')
          assert 'guide-e-tutorial/veicoli-per-moses/' in garage
          assert 'class="v-operation-brief"' in garage
          print('PUBLIC_ACTION_FIRST_MOSES_OK',base+'guide-e-tutorial/veicoli-per-moses/')
          js=fetch('assets/guide-flow-v1.js')
          css=fetch('assets/guide-flow-v1.css')
          assert 'HO FINITO IL TUTORIAL' in js
          assert 'PASSO PRIMA' in js
