name: GTA 6 Italia - Website

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'data/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - 'growth_tracking_v1.py'
      - 'test_growth_tracking_v1.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 21 11 *'
    - cron: '45 */4 * * *'

permissions:
  contents: read
concurrency:
  group: gta6-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  # During launch, a fresh main-branch commit supersedes stale builds.
  # The latest deployment receives its own post-deploy HTTP checks.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze legacy Rockstar archive pending specific reuse evidence
        run: |
          git diff --exit-code 8eadc74aa5d67ec98d3ea02209689b1713451726 -- site/assets/rockstar/gta-vi/
          test -z "$(git ls-files --others --exclude-standard -- site/assets/rockstar/gta-vi/)"
          echo 'LEGACY_ROCKSTAR_ARCHIVE_UNCHANGED (not a rights grant)'
      - name: Python pinned
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Fetch research from public GTA VI bot (no Buffer)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python fetch_community_feed.py
      - name: Import verified patch metadata from the existing public bot ledger
        if: github.event_name != 'pull_request'
        run: python patch_observations_v1.py
      - name: Collect owned X post excerpts without requiring GitHub login
        run: python community_social_sync_v1.py
      - name: Validate preserved content and existing SEO contracts
        run: |
          python -m py_compile x_growth_dashboard_v1.py test_x_growth_dashboard_v1.py interactive_article_maps_v1.py test_interactive_article_maps_v1.py test_curated_map_permalinks_v1.py photo_coverage_v5.py test_photo_coverage_v5.py social_cards_v2.py test_social_cards_v2.py collectible_routes_v4.py collectible_photo_evidence_v1.py test_collectible_photo_evidence_v1.py photo_intake_v4.py test_photo_routes_v4.py advanced_platinum_v3.py photo_provenance_v3.py test_advanced_platinum_v3.py platinum_atlas_v2.py guide_location_atlas_v2.py test_group12_atlas_v2.py platinum_roadmap_v1.py guide_step_references_v1.py test_group3_roadmap_step_refs_v1.py photo_request_hub_v1.py test_photo_request_hub_v1.py build_site.py build_visual_site.py visual_guide_content.py operational_brief_v1.py moses_vehicle_jobs_v1.py first_car_steps_v1.py test_first_car_steps_v1.py chapter1_money_steps_v1.py test_chapter1_money_steps_v1.py test_waink_verified_v1.py vehicle_catalog_v1.py test_vehicle_catalog_v1.py rockstar_gallery_v1.py test_rockstar_gallery_v1.py test_operational_guides_v1.py community_social_v1.py community_social_sync_v1.py community_discovery_v2.py guide_source_validation.py prepare_visual_media.py reader_experience.py media_quality_v1.py growth_tracking_v1.py meditation_tracker_v1.py test_meditation_tracker_v1.py test_home_clarity_v1.py
          python -m unittest -q test_patch_observations_v1.py test_x_growth_dashboard_v1.py test_curated_map_permalinks_v1.py test_interactive_article_maps_v1.py test_photo_coverage_v5.py test_photo_routes_v4.py test_advanced_platinum_v3.py test_group12_atlas_v2.py test_group3_roadmap_step_refs_v1.py test_meditation_tracker_v1.py test_site.py test_community_feed.py test_related_research.py test_guide_source_validation.py
          node --check site/assets/interactive-map-v1.js
          node --check site/assets/photo-coverage-v5.js
          node --check site/assets/photo-intake-v4.js
          node --check site/assets/collectible-routes-v4.js
          node --check site/assets/advanced-platinum-v3.js
          node --check site/assets/platinum-atlas-v2.js
          node --check site/assets/platinum-roadmap.js
          node --check site/assets/visual-v2.js
          node --check site/assets/reader-theme.js
          node --check site/assets/guide-flow-v1.js
          node --check site/assets/step-video-opt-in-v1.js
          node --check site/assets/vehicle-finder-v1.js
          node --check site/assets/collectible-beginner-v1.js
          node --check site/assets/community-social-v1.js
          python -m py_compile community_social_sync_v1.py test_x_permalink_site_v1.py test_beginner_platinum_v1.py
          python -m unittest -q test_community_social_v1.py test_x_permalink_site_v1.py test_growth_tracking_v1.py
      - name: Keep legacy provider image references link-only
        run: |
          python -m pip install 'Pillow>=11,<13'
          python prepare_visual_media.py
          python -m unittest -q test_legacy_visual_media_v1.py
      - name: Prepare public X growth evidence from fixed GitHub issues (read only)
        env:
          PUBLIC_GROWTH_FETCH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$PUBLIC_GROWTH_FETCH" = "true" ]; then
            python x_growth_dashboard_v1.py --refresh --output .runtime/x-growth-evidence-v1.json
          else
            python x_growth_dashboard_v1.py --output .runtime/x-growth-evidence-v1.json
          fi
      - name: Build visual production pages with responsive reader and sourced tips
        env:
          PATCH_LEDGER_REQUIRED: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          GSC_SITE_VERIFICATION: ${{ vars.GSC_SITE_VERIFICATION }}
          # Public Umami UUID from the owner; NEVER track PR browser QA.
          # Evaluated before the generator and privacy page run.
          UMAMI_WEBSITE_ID: ${{ github.event_name != 'pull_request' && 'ec3592c0-e9f7-4e13-8c29-f9c7d59aa8fd' || '' }}
        run: python reader_experience.py --build
      - name: Generate distinct 1200x630 cards for all canonical article URLs
        env:
          GTA6_FETCH_ROCKSTAR_ART: 'false'
        run: |
          python social_cards_v2.py
          python -m unittest -q test_social_cards_v2.py
          python -m unittest -q test_editorial_feed_v1.py
          python editorial_feed_v1.py
      - name: Apply shared GTA VI sunset design and editorial navigation
        run: python sunset_blog_v1.py build
      - name: Audit actual local media and five-image guide target
        run: python media_quality_v1.py
      - name: Verify illustrated article and all 189 Rockstar originals
        run: |
          node --check site/assets/cinematic-v3.js
          node --check site/assets/hero-slideshow.js
          node --check site/assets/creator-video-hub-v1.js
          node test_hero_slideshow.js
          python -m unittest -q test_editorial_articles.py test_cinematic_site.py
      - name: Verify source-rated TV picture values and original reference artwork
        run: |
          python -m py_compile hdr_tv_picture_v1.py test_hdr_tv_picture_v1.py
          python -m unittest -q test_hdr_tv_picture_v1.py
      - name: Validate actual production pages, media and canonical continuity
        run: python -m unittest -q test_x_growth_dashboard_v1.py test_curated_map_permalinks_v1.py test_interactive_article_maps_v1.py test_photo_coverage_v5.py test_photo_routes_v4.py test_advanced_platinum_v3.py test_group12_atlas_v2.py test_group3_roadmap_step_refs_v1.py test_visual_site.py test_reader_experience.py test_beginner_platinum_v1.py test_operational_guides_v1.py test_first_car_steps_v1.py test_chapter1_money_steps_v1.py test_waink_verified_v1.py test_vehicle_catalog_v1.py test_rockstar_gallery_v1.py test_step_image_sources_v1.py test_collectible_photo_evidence_v1.py test_media_quality_v1.py test_community_social_v1.py test_x_permalink_site_v1.py test_growth_tracking_v1.py test_meditation_tracker_v1.py test_photo_request_hub_v1.py test_home_clarity_v1.py test_creator_video_hub_v1.py
      - name: Check curated YouTube metadata without downloading media
        run: |
          python -m unittest -q test_creator_video_health_v1.py
          if ! timeout 45s python creator_video_health_v1.py; then
            echo 'Creator video metadata probe incomplete; playback and rights remain unverified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit static Google discovery links (no network or tracking)
        run: |
          python -m unittest -q test_internal_link_graph_v1.py
          python internal_link_graph_v1.py
          echo '### GTA VI Italia – Internal links (static SEO graph)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage based on generated HTML and sitemap, NOT Google index status.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .runtime/seo-link-graph-v1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build isolated noindex Cloux design preview (existing assets only)
        run: python cloux_preview_v1.py build
      - name: Select one free daily production browser QA slot
        id: daily_reader_qa
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # The existing four-hour schedule already runs at 04:45 UTC.
          # Use that one slot for full viewport QA; never add paid runners
          # or turn every site rebuild into a browser install.
          current_hour="$(date -u +%H)"
          # GitHub's cron runner may start well after the planned 04:45 UTC
          # time. Accept delays until 07:59, before the next 08:45 UTC slot.
          case "$current_hour" in
            04|05|06|07) daily_window=true ;;
            *) daily_window=false ;;
          esac
          if [ "$SCHEDULE" = '45 */4 * * *' ] && [ "$daily_window" = 'true' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check responsive theme, visible spoiler notices and zoom in a real browser
        # PRs always run visual QA; one existing daily scheduled build repeats
        # it in production using standard public-repo hosted runners.
        if: github.event_name == 'pull_request' || steps.daily_reader_qa.outputs.enabled == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python test_reader_experience.py --browser
          python cloux_preview_v1.py browser
          python sunset_blog_v1.py browser
      - name: Keep reader screenshots and test report
        if: always() && (github.event_name == 'pull_request' || steps.daily_reader_qa.outputs.enabled == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reader-qa-${{ github.run_id }}
          path: reader-qa
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve Google Search Console verification document
        run: |
          python - <<'PY'
          from pathlib import Path
          name = 'google232edbd3526a5a1d.html'
          expected = b'google-site-verification: google232edbd3526a5a1d.html'
          source = Path('site') / name
          assert source.read_bytes() == expected, 'Unexpected Google verification file contents'
          destination = Path('_site') / name
          destination.write_bytes(source.read_bytes())
          assert destination.read_bytes() == expected
          print('GSC_VERIFICATION_FILE_INCLUDED',destination)
          PY
      - name: Publish only reader content (editorial artifacts remain in CI)
        run: |
          python -m py_compile public_release_gate.py test_public_release_gate.py test_public_private_paths_live_v1.py
          python -m unittest -q test_public_release_gate.py test_public_private_paths_live_v1.py
          python public_release_gate.py --apply
          python public_release_gate.py
          python cloux_preview_v1.py verify
          python sunset_blog_v1.py verify
      - name: Upload static site to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" != "200" ] || ! grep -Eq '"build_type"[[:space:]]*:[[:space:]]*"workflow"' /tmp/pages.json; then
            echo '::error::Pages must use GitHub Actions before deployment.'
            exit 1
          fi
      - name: Deploy verified visual site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify exact public photographic cover bytes (no Buffer access)
        run: |
          python - <<'PY'
          import hashlib,re,time,urllib.request
          base='https://xfederiko11.github.io/gta-6/'
          paths=('salvare-auto/','guide-e-tutorial/scansionare-veicoli/',
                 'guide-e-tutorial/studiare-animali/','articoli/gta-vi-leonida-sei-luoghi/',
                 'articoli/gta-vi-ultimate-edition-auto-garage/')
          def fetch(url, limit):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'GTA6Italia-PublicQA/1.0'})
              with urllib.request.urlopen(req,timeout=10) as r:
                  assert r.status==200 and r.geturl()==url
                  data=r.read(limit+1)
                  assert len(data)<=limit
                  return data,r.headers.get_content_type()
          for path in paths:
              url=base+path
              for attempt in range(4):
                  try:
                      raw,_=fetch(url,1500000)
                      text=raw.decode('utf-8')
                      assert re.findall(r'<meta name="gta6:cover-kind" content="([^"]+)">',text) in (['official_game_photo'],['approved_gameplay'])
                      hashes=re.findall(r'<meta name="gta6:cover-sha256" content="([a-f0-9]{64})">',text)
                      assert len(hashes)==1
                      cover=base+'assets/social-cards/'+hashlib.sha256(path.encode()).hexdigest()[:16]+'.jpg'
                      assert text.count('<meta property="og:image" content="'+cover+'">')==1
                      assert text.count('<meta name="twitter:image" content="'+cover+'">')==1
                      figure=text.split('data-article-cover="shared-social"',1)[1].split('</figure>',1)[0]
                      assert 'src="'+cover+'"' in figure
                      data,mime=fetch(cover,1600000)
                      assert mime=='image/jpeg' and data.startswith(bytes.fromhex('ffd8ff')) and data.endswith(bytes.fromhex('ffd9'))
                      assert hashlib.sha256(data).hexdigest()==hashes[0]
                      print('PUBLIC_GAME_PHOTO_SHA256_OK',url,hashes[0])
                      break
                  except Exception:
                      if attempt==3: raise
                      time.sleep(4*(attempt+1))
          PY
      - name: Checkout exact public feed contract (no write credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify isolated design preview and existing photographs over HTTP
        run: |
          python cloux_preview_v1.py live
          python sunset_blog_v1.py live
      - name: Verify deployed reader feed for autonomous bot integration
        run: python editorial_feed_v1.py --live
      - name: Verify public pages serve responsive reader, X header and spoiler warnings
        run: |
          python - <<'PY'
          import urllib.request, time, json
          base='https://xfederiko11.github.io/gta-6/'
          for path in ('','patch/','patch/2026-11-23/','immagini-ufficiali/','video-tutorial/','veicoli/','veicoli/declasse-yosemite-1500/','soldi-facili/','auto-speciali/','salvare-auto/','guide-e-tutorial/soldi-facili-capitolo-1/','guide-e-tutorial/soldi-2500-three-sheets-liquor/','guide-e-tutorial/scansionare-veicoli/','guide-e-tutorial/glitch-prima-persona-ps5/','guide-e-tutorial/viaggio-rapido-taxi/','trofei/trofeo-15-stunt-da-capogiro/','trofei/roadmap-platino/','mappe-guide/','trofei/100-percento/','trofei/trofei-difficili/','collezionabili/percorsi/','screenshot-ps5/invia/'):
              for attempt in range(6):
                  try:
                      request=urllib.request.Request(base+path+'?reader=adaptive-v2-20261120',headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          text=response.read(1500000).decode('utf-8'); status=response.status
                      assert status==200
                      assert 'data-design-version="visual-v2-20261120"' in text
                      assert 'assets/social-cards/' in text
                      assert text.count('<meta property="og:image" content="')==1
                      assert text.count('<meta name="twitter:image" content="')==1
                      if path=='patch/':
                          assert 'id="osservazioni-ufficiali"' in text
                      if path=='patch/2026-11-23/':
                          assert text.count('data-patch-fix')==7
                          assert 'support.rockstargames.com/articles/sN5pEdFYZdlvijKXd6xpJ/' in text
                          assert 'data-article-cover="shared-social"' in text
                      if 'data-article-cover="shared-social"' in text:
                          import re
                          cover=text.split('data-article-cover="shared-social"',1)[1].split('</figure>',1)[0]
                          image=re.search(r'<img src="([^"]+)"',cover).group(1)
                          assert '<meta property="og:image" content="'+image+'">' in text
                          assert '<meta name="twitter:image" content="'+image+'">' in text
                      if 'id="procedura" class="v-tutorial"' in text:
                          assert 'data-article-cover="shared-social"' in text
                          assert 'guide-flow-v1.js?v=' not in text
                          assert 'data-mo-show-all' not in text
                      assert 'visual-v2.css?v=' in text and 'visual-v2.js?v=' in text
                      assert '<link rel="canonical" href="'+base+path+'"' in text
                      assert 'data-theme="auto"' in text
                      assert 'reader-chapter1-money-v12-20261124' in text
                      assert 'reader-theme.css?v=' in text and 'data-theme-choice="light"' in text and 'data-theme-choice="dark"' in text
                      assert "var t='dark'" in text
                      assert 'class="v-x-link"' in text and 'https://x.com/xFederiko11' in text
                      assert 'data-spoiler-choice' not in text
                      if path=='video-tutorial/':
                          assert text.count('class="cv-card"') == 4
                          assert text.count('data-cv-video-id=') == 4
                          assert 'creator-video-hub-v1.js?v=' in text
                          assert 'creator-video-hub-v1.css?v=' in text
                          assert 'youtube-nocookie.com/embed/' not in text
                          assert '<iframe' not in text
                          print('PUBLIC_CREATOR_HUB_OK',base+path)
                      if path=='veicoli/':
                          assert text.count('class="vc-card"')==32
                          assert 'vehicle-finder-v1.js?v=' in text
                      if path=='veicoli/declasse-yosemite-1500/':
                          assert 'Bastion Street' in text
                          assert '1.850 GTA$' in text
                          assert 'data-vc-detail="declasse-yosemite-1500"' in text
                      if path == 'trofei/roadmap-platino/':
                          assert 'data-platinum-roadmap' in text
                          assert 'data-trophy-atlas' in text
                          assert text.count('data-atlas-card ') == 55
                          assert text.count('data-atlas-spoiler') == 28
                          assert '/gta-6/assets/platinum-roadmap.js?v=' in text
                          assert '/gta-6/assets/platinum-roadmap.css?v=' in text
                          assert '/gta-6/assets/platinum-atlas-v2.js?v=' in text
                          assert '/gta-6/assets/platinum-atlas-v2.css?v=' in text
                      if path in ('mappe-guide/','collezionabili/percorsi/','guide-e-tutorial/soldi-facili-capitolo-1/','guide-e-tutorial/viaggio-rapido-taxi/','trofei/trofeo-15-stunt-da-capogiro/'):
                          assert text.count('data-vi-map ')==1
                          assert 'interactive-map-v1.css?v=' in text and 'interactive-map-v1.js?v=' in text
                          assert 'data-vim-load' in text and 'data-vim-provider="vice"' in text
                          assert '<iframe src=' not in text
                      if path == 'mappe-guide/':
                          assert text.count('data-vim-curated-link') == 7
                          assert 'https://gtamap.io/?m=permit-keys' in text
                          assert text.count('data-location-guide=') == 11
                          assert '/gta-6/screenshot-ps5/' in text
                      if path == 'trofei/100-percento/':
                          assert 'data-advanced-platinum-100' in text
                          assert text.count('data-ap-metric="') == 35
                          assert text.count('data-ap-card="') == 18
                          assert 'advanced-platinum-v3.js?v=' in text
                          assert 'advanced-platinum-v3.css?v=' in text
                      if path == 'trofei/trofei-difficili/':
                          assert text.count('data-hard-trophy="') == 7
                          assert 'data-hard-status="incerto"' in text
                          assert 'advanced-platinum-v3.css?v=' in text
                      if path == 'collezionabili/percorsi/':
                          assert text.count('data-cr-curated-link') == 10
                          assert 'https://gtamap.io/?m=jasons-safehouse' in text
                          assert 'https://gtamap.io/gta-6-map/starlet-motel/' in text
                          assert text.count('data-cr-step=') == 123
                          assert text.count('data-cr-region=') == 7
                          assert 'data-cr-done' in text and 'Vicki' in text and 'Victor Maravilla' in text
                          assert 'collectible-routes-v4.js?v=' in text
                      if path == 'screenshot-ps5/invia/':
                          assert text.count('data-photo-guide=') == 55
                          assert 'data-pi-rights' in text
                          assert 'data-pi-submit disabled' in text
                          assert 'photo-intake-v4.js?v=' in text
                          assert 'Non è un upload dal sito' in text
                      if path == 'salvare-auto/':
                          assert text.count('data-step-video-id="R0GdEkPZSvM"') == 2
                          assert text.count('data-step-video-open hidden') == 2
                          assert text.count('data-step-video-seconds="266"') == 1
                          assert text.count('data-step-video-seconds="675"') == 1
                          assert 'step-video-opt-in-v1.js?v=' in text
                          assert 'step-video-opt-in-v1.css?v=' in text
                          assert '<iframe' not in text
                      if path == 'guide-e-tutorial/scansionare-veicoli/':
                          assert text.count('data-step-video-id="R0GdEkPZSvM"') == 1
                          assert text.count('data-step-video-seconds="266"') == 1
                          assert text.count('data-step-video-id="0RBe_fz67gs"') == 1
                          assert text.count('data-waink-diagram=') == 5
                          assert text.index('class="waink-video-intro"') < text.index('class="v-operation-brief"')
                          assert 'class="v-guide-prep"' not in text
                          assert '<iframe' not in text
                      if path == 'guide-e-tutorial/meditazione-capitolo-1/':
                          assert text.count('data-step-video-id="WZ9EM_i_W38"') == 2
                          assert text.count('data-step-video-seconds="22"') == 1
                          assert text.count('data-step-video-seconds="377"') == 1
                          assert text.count('data-meditation-video-link') == 10
                          assert 'Learn to Meditate Together' in text
                          assert 'step-video-opt-in-v1.js?v=' in text
                          assert '<iframe' not in text
                      if path == 'guide-e-tutorial/glitch-prima-persona-ps5/':
